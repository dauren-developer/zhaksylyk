<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A3323">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Жаксылык">
<title>Жаксылык</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F3F3EC; --card:#FFFFFF; --soft:#E7E9DD; --chip:#DCE0D0;
  --ink:#2A3323; --ink2:#3A4630; --muted:#79826C; --muted2:#A0A895;
  --line:#DFE2D4; --line2:#C9CFB8;
  --gr:#4A5A3A; --gr-d:#36432A; --gr-l:rgba(74,90,58,.10); --gr-m:rgba(74,90,58,.20);
  --lite:#8B9B6F;
  --red:#A85742; --red-l:rgba(168,87,66,.12);
  --amber:#9A7B2E; --amber-l:rgba(154,123,46,.14);
  --disp:'Oswald',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
  --nav:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  line-height:1.5;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 10px)}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--gr);outline-offset:2px}
.app{max-width:560px;margin:0 auto}
.pad{padding:0 16px}

header{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff}
.hb{display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--gr);color:#fff;display:grid;place-items:center;
  font-family:var(--disp);font-weight:600;font-size:16px;flex:none}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-family:var(--disp);font-weight:500;font-size:16px;letter-spacing:.05em;
  text-transform:uppercase;line-height:1.15}
.htitle span{font-size:11.5px;color:#AFB89E}
.iconbtn{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center;
  color:#E4E8D8;flex:none;font-size:16px}
.wknav{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:10px;
  padding:4px;margin:0 16px 11px}
.wknav button{width:32px;height:32px;border-radius:7px;color:#D3DAC3;display:grid;place-items:center;font-size:17px}
.wknav b{flex:1;text-align:center;font-family:var(--disp);font-weight:400;font-size:14px;color:#fff}

nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--ink);
  box-shadow:0 -2px 18px rgba(42,51,35,.20);padding-bottom:env(safe-area-inset-bottom)}
.nb{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nb button{height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:#98A288;font-size:10.5px;font-weight:700}
.nb button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb button.on{color:#fff}
.nb button.on svg{stroke:#C3D49A}

main{padding:16px 0 26px}
.page{display:none}.page.on{display:block}

h2.t{font-family:var(--disp);font-weight:500;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 3px}
p.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
h3.s{font-family:var(--disp);font-weight:500;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gr);margin:22px 0 10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(42,51,35,.05)}
.card.tap:active{border-color:var(--gr)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.kpi small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.kpi b{display:block;font-family:var(--disp);font-weight:500;font-size:23px;margin-top:4px}
.kpi .d{font-size:12px;font-weight:600;margin-top:2px}
.up{color:var(--gr)}.down{color:var(--red)}.dim{color:var(--muted)}

.rowitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rowitem:last-child{border-bottom:none}
.rowitem .main{flex:1;min-width:0}
.rowitem .main b{display:block;font-weight:700;font-size:15px}
.rowitem .main span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.rowitem .val{font-family:var(--disp);font-weight:400;font-size:16px;white-space:nowrap}

label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--line2);border-radius:11px;
  background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gr)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;border-radius:11px;
  font-weight:800;font-size:15px;background:var(--gr);color:#fff}
.btn:active{background:var(--gr-d)}
.btn.gh{background:var(--card);border:1px solid var(--line2);color:var(--ink);font-weight:700}
.btn.gh:active{background:var(--soft)}
.btn.sm{padding:9px 13px;font-size:13.5px;width:auto;border-radius:9px}
.btn:disabled{opacity:.45}
.rowbtns{display:flex;gap:9px;flex-wrap:wrap}
.rowbtns .btn{width:auto;flex:1}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:100px;border:1px solid var(--line2);background:var(--card);
  font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--gr);border-color:var(--gr);color:#fff}
.chip small{display:block;font-size:10.5px;font-weight:600;opacity:.8}

.who{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:100px;background:var(--chip);
  font-size:13.5px;font-weight:700;margin:0 6px 6px 0}
.who button{width:18px;height:18px;border-radius:50%;background:rgba(42,51,35,.13);color:var(--ink);
  display:grid;place-items:center;font-size:12px;line-height:1}

.lvl{display:inline-block;min-width:40px;text-align:center;padding:4px 10px;border-radius:20px;
  font-family:var(--disp);font-weight:500;font-size:13.5px}
.l6{background:var(--chip);color:var(--muted)}
.l7{background:rgba(139,155,111,.22);color:#5A6A44}
.l8{background:var(--gr-m);color:var(--gr-d)}
.l9{background:var(--gr);color:#fff}

.badge{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:700}
.b-ok{background:var(--gr-m);color:var(--gr-d)}
.b-no{background:var(--red-l);color:var(--red)}
.b-dim{background:var(--chip);color:var(--muted)}
.b-am{background:var(--amber-l);color:var(--amber)}

.bar{height:8px;background:var(--soft);border-radius:5px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .35s}

.note{background:var(--gr-l);border:1px solid var(--gr-m);border-radius:11px;padding:12px 13px;
  font-size:13px;color:var(--gr-d);margin-top:12px}
.note.warn{background:var(--red-l);border-color:rgba(192,80,60,.3);color:#8E3524}
.note.am{background:var(--amber-l);border-color:rgba(176,122,34,.3);color:#7A5313}
.empty{text-align:center;padding:32px 18px;color:var(--muted)}
.empty b{display:block;font-family:var(--disp);font-weight:500;font-size:16px;color:var(--ink);margin-bottom:6px}
.mini{font-size:12.5px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted2);margin-top:6px}
.del{color:var(--red);font-size:13px;font-weight:700}

.ov{position:fixed;inset:0;z-index:80;background:rgba(42,51,35,.42);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh;overflow-y:auto;
  animation:up .26s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.sh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh b{font-family:var(--disp);font-weight:500;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.sh span{display:block;font-size:12.5px;color:var(--muted);font-family:var(--body);letter-spacing:0;
  text-transform:none;font-weight:400}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--card);
  display:grid;place-items:center;color:var(--muted);font-size:17px;flex:none}
/* ---------- две колонки ---------- */
.cols{display:grid;gap:12px}

/* ---------- широкий экран ---------- */
@media(min-width:900px){
  body{padding-bottom:30px}
  .app{max-width:1080px}
  header{padding-bottom:2px}
  .hb{padding:14px 24px 10px}
  .htitle b{font-size:18px}
  .wknav{margin:0 24px 10px;max-width:320px}
  nav{position:static;box-shadow:none;background:transparent;padding:0}
  .nb{max-width:none;grid-template-columns:repeat(5,auto);justify-content:start;gap:4px;padding:0 20px 10px}
  .nb button{height:44px;flex-direction:row;gap:9px;padding:0 16px;border-radius:9px;font-size:14px}
  .nb button.on{background:rgba(255,255,255,.12)}
  .pad{padding:0 24px}
  main{padding:22px 0 30px}
  h2.t{font-size:24px}
  p.sub{font-size:14.5px;max-width:70ch}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .cols{grid-template-columns:1fr 1fr}
  .chips{padding:2px 24px 10px;margin:0 -24px}
  .sheet{max-width:620px;border-radius:16px;margin-bottom:auto;margin-top:auto;max-height:86vh}
  .ov{align-items:center}
  .card{padding:17px}
}
@media(min-width:1180px){
  .app{max-width:1180px}
  .cols{grid-template-columns:1fr 1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;padding:0!important;font-size:11pt}
  header,nav,main,.ov{display:none!important}
  #printArea{display:block!important}
  .pr-h{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
  .pr-h b{font-family:var(--disp);font-size:19pt;letter-spacing:.04em;text-transform:uppercase;display:block}
  .pr-h span{font-size:10pt;color:#444}
  .pr-k{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .pr-k div{border:1px solid #999;border-radius:4px;padding:7px 12px}
  .pr-k small{display:block;font-size:8.5pt;color:#555;text-transform:uppercase}
  .pr-k b{font-family:var(--disp);font-size:14pt}
  table.pr{width:100%;border-collapse:collapse;font-size:9pt}
  table.pr th{background:#eee;border:1px solid #999;padding:6px 7px;text-align:left;font-size:8pt;text-transform:uppercase}
  table.pr td{border:1px solid #bbb;padding:6px 7px;white-space:nowrap}
  table.pr td:first-child{white-space:normal}
  table.pr td.n,table.pr th.n{text-align:right}
  table.pr tfoot td{background:#eee;font-weight:800}
  .pr-f{margin-top:16px;font-size:8.5pt;color:#555;border-top:1px solid #999;padding-top:8px}
  .pr-sign{margin-top:26px;display:flex;gap:50px;font-size:9.5pt}
  .pr-sign div{flex:1;border-top:1px solid #000;padding-top:5px;color:#555}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="hb">
    <div class="logo">Ж</div>
    <div class="htitle"><b id="hT">Жаксылык</b><span id="hS"></span></div>
    <button class="iconbtn" id="langBtn" onclick="setLang(LANG==='ru'?'kz':'ru')" aria-label="Язык"
      style="width:auto;padding:0 11px;font-size:12.5px;font-weight:800;letter-spacing:.04em"></button>
    <button class="iconbtn" id="syncBtn" onclick="go('more')" aria-label="Связь">○</button>
  </div>
  <div class="wknav">
    <button onclick="wkShift(-1)" aria-label="Назад">‹</button>
    <b id="wkLbl"></b>
    <button onclick="wkShift(1)" aria-label="Вперёд">›</button>
  </div>
  <nav><div class="nb" id="nav"></div></nav>
</header>
<main>
  <section class="page on" id="p-day"></section>
  <section class="page" id="p-plan"></section>
  <section class="page" id="p-calc"></section>
  <section class="page" id="p-more"></section>
</main>
</div>
<div id="printArea"></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>

<script>
/* ==========================================================
   ЖАКСЫЛЫК — расчёт оплаты официантов
   План на неделю → дневные планы по зонам → расстановка людей
   ========================================================== */
const CFG={graceMin:15};

/* ============================================================
   НАСТРОЙКИ ОБЩЕЙ БАЗЫ
   Заполните один раз перед загрузкой на GitHub — тогда
   пользователям останется только ввести почту и пароль.
   ============================================================ */
const SUPABASE_URL = "https://krtwbttarvsafrehedfl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtydHdidHRhcnZzYWZyZWhlZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwODQyNzEsImV4cCI6MjEwMzY2MDI3MX0.xZwD0qaPKE8OAWKoJKab7hVILKVnBNic39ATmaWK_fk";   // ключ anon public со вкладки Legacy

const DAYS_RU=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DAYS_KZ=['Дс','Сс','Ср','Бс','Жм','Сн','Жс'];
const DAYFULL_KZ=['Дүйсенбі','Сейсенбі','Сәрсенбі','Бейсенбі','Жұма','Сенбі','Жексенбі'];
const dayPlanLabel=()=>LANG==='kz'
  ? DAYFULL_KZ[selDay]+' жоспары'
  : 'План на '+DAYACC[selDay];
const MON_KZ=['қаң','ақп','нау','сәу','мам','мау','шіл','там','қыр','қаз','қар','жел'];
const DAYFULL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DAYACC=['понедельник','вторник','среду','четверг','пятницу','субботу','воскресенье'];
const DAYKZ=['дүйсенбі','сейсенбі','сәрсенбі','бейсенбі','жұма','сенбі','жексенбі'];
const MON_RU=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const DAYS=new Proxy({},{get:(_,i)=>(LANG==='kz'?DAYS_KZ:DAYS_RU)[i],
  has:()=>true,ownKeys:()=>['0','1','2','3','4','5','6'],
  getOwnPropertyDescriptor:()=>({enumerable:true,configurable:true})});
const MON=new Proxy({},{get:(_,i)=>(LANG==='kz'?MON_KZ:MON_RU)[i]});

const defaultCalcCfg=()=>({shift8:375000,shift7:275000,week8:2200000,week7:1000000,late7:3,late6:4,reviewsPerLate:10});
const DB={staff:[],zones:[],weeks:{},calcCfg:defaultCalcCfg()};
const blankWeek=()=>({weekPlan:0,zonePlans:{},assign:{},marks:{},revenue:{},manual:{},notes:[],
  lateManual:{},lateDays:{},reviews:{},shiftsManual:{},posuda:{},avans:{},overrideLevel:{},overrideReason:{}});
/* zonePlans: {day:{zone:сумма}}   assign: {day:{zone:[staffId]}} — используются только для расстановки по зонам,
   на расчёт процента больше не влияют. Процент считается по кассе, сменам и опозданиям — см. calc(). */

let curWeek=mondayOf(new Date()), tab='day', selDay=(new Date().getDay()+6)%7;
function mondayOf(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x;}
const iso=d=>d.toISOString().slice(0,10);
const dayDate=i=>{const d=new Date(curWeek);d.setDate(d.getDate()+i);return d;};
const fmt=n=>Math.round(n||0).toLocaleString('ru-RU').replace(/,/g,' ')+' ₸';
const fmtS=n=>{n=Math.round(n||0);return n>=1e6?(n/1e6).toFixed(2).replace('.',',')+' млн':n.toLocaleString('ru-RU').replace(/,/g,' ');};
function W(){
  const k=iso(curWeek);if(!DB.weeks[k])DB.weeks[k]=blankWeek();
  const w=DB.weeks[k];
  if(!w.lateManual)w.lateManual={};
  if(!w.lateDays)w.lateDays={};
  if(!w.reviews)w.reviews={};
  if(!w.shiftsManual)w.shiftsManual={};
  if(!w.posuda)w.posuda={};
  if(!w.avans)w.avans={};
  if(!w.overrideLevel)w.overrideLevel={};
  if(!w.overrideReason)w.overrideReason={};
  return w;
}
function wkLabel(){const e=new Date(curWeek);e.setDate(e.getDate()+6);
  return `${curWeek.getDate()} ${MON[curWeek.getMonth()]} — ${e.getDate()} ${MON[e.getMonth()]}`;}
function wkShift(n){const d=new Date(curWeek);d.setDate(d.getDate()+7*n);curWeek=d;render();fgSyncLate();}
const mins=t=>{if(!t)return null;const[h,m]=String(t).split(':').map(Number);return h*60+(m||0);};
const norm=s=>{let t=String(s||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();
  return t.replace(/[қғңүұөһі]/g,ch=>({'қ':'к','ғ':'г','ң':'н','ү':'у','ұ':'у','ө':'о','һ':'х','і':'и'}[ch]));};


/* ================= ЯЗЫК ================= */
let LANG=(()=>{try{return localStorage.getItem('zh_lang')||'ru'}catch(e){return 'ru'}})();
function setLang(l){LANG=l;try{localStorage.setItem('zh_lang',l)}catch(e){}drawNav();render();}
const TR={
"Уровень — по кассе за смену (или за неделю, если смены не внесены) и по опозданиям. 9% ставится вручную по каждому официанту отдельно.":

"Смены, опоздания, 9%":"Ауысым, кешігу, 9%",

"Загрузите отчёт за неделю.":"Апта есебін жүктеңіз.",
"Отчёт в PDF":"PDF есебі",
"Правила расчёта":"Есептеу ережелері",

const TRL=Object.entries(TR).sort((a,b)=>b[0].length-a[0].length);
const T=s=>LANG==='kz'?(TR[s]||s):s;
const RX=new RegExp(TRL.map(([r])=>r.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
function swap(v){return v.replace(RX,m=>TR[m]||m);}
function trDom(root){
  if(LANG!=='kz'||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),arr=[];
  while(w.nextNode())arr.push(w.currentNode);
  arr.forEach(n=>{const o=swap(n.nodeValue);if(o!==n.nodeValue)n.nodeValue=o;});
  root.querySelectorAll('[placeholder]').forEach(e=>e.setAttribute('placeholder',swap(e.getAttribute('placeholder'))));
}

const H=()=>({apikey:CLOUD.key,Authorization:'Bearer '+(AUTH.token||CLOUD.key),'Content-Type':'application/json'});
async function signIn(email,pass){
  const r=await fetch(`${CLOUD.url}/auth/v1/token?grant_type=password`,{method:'POST',
    headers:{apikey:CLOUD.key,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
  const a=await r.json();
  if(!r.ok)throw new Error(a.error_description||a.msg||'Не удалось войти');
  AUTH.token=a.access_token;AUTH.refresh=a.refresh_token;AUTH.email=email;
  AUTH.exp=Date.now()+(a.expires_in||3600)*1000;CLOUD.who=email.split('@')[0];authSave();return true;
}
async function refreshToken(){if(!AUTH.refresh)return false;
  try{const r=await fetch(`${CLOUD.url}/auth/v1/token?grant_type=refresh_token`,{method:'POST',
      headers:{apikey:CLOUD.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:AUTH.refresh})});
    const a=await r.json();if(!r.ok)return false;
    AUTH.token=a.access_token;AUTH.refresh=a.refresh_token;AUTH.exp=Date.now()+(a.expires_in||3600)*1000;
    authSave();return true;}catch(e){return false;}}
async function ensureToken(){if(!AUTH.token)return false;
  if(Date.now()>AUTH.exp-60000)return await refreshToken();return true;}
async function cloudPull(silent){
  if(!CLOUD.on)return;
  if(!await ensureToken()){CLOUD.state='err';syncBadge();return;}
  try{
    const r=await fetch(`${CLOUD.url}/rest/v1/state?id=eq.1&select=rev,data`,{headers:H()});
    if(!r.ok){const b=await r.text();throw new Error(errText(r.status,b));}
    const a=await r.json();
    if(!a.length){await cloudPush();return;}
    if(a[0].rev>CLOUD.rev){CLOUD.applying=true;Object.assign(DB,a[0].data||{});DB.calcCfg=Object.assign(defaultCalcCfg(),DB.calcCfg||{});CLOUD.rev=a[0].rev;
      CLOUD.applying=false;CLOUD.state='ok';syncBadge();if(!silent)render();else render();return true;}
    CLOUD.state='ok';syncBadge();
  }catch(e){CLOUD.state='err';CLOUD.err=String(e.message||e);syncBadge();}
}
async function cloudPush(){
  if(!CLOUD.on||CLOUD.applying)return;
  if(!await ensureToken()){CLOUD.state='err';syncBadge();return;}
  CLOUD.state='sync';syncBadge();
  try{
    const r=await fetch(`${CLOUD.url}/rest/v1/state?on_conflict=id`,{method:'POST',
      headers:{...H(),Prefer:'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify({id:1,rev:CLOUD.rev+1,data:DB,who:CLOUD.who||'—',updated_at:new Date().toISOString()})});
    if(!r.ok){const b=await r.text();throw new Error(errText(r.status,b));}
    const a=await r.json();if(a&&a[0])CLOUD.rev=a[0].rev;
    CLOUD.state='ok';
  }catch(e){CLOUD.state='err';CLOUD.err=String(e.message||e);}
  syncBadge();
}
function errText(code,body){
  if(code===404||/does not exist|relation/i.test(body))
    return 'Таблица не создана. Выполните SQL-код в Supabase (кнопка «Настройка»)';
  if(code===401||code===403)return 'Нет доступа. Проверьте ключ или войдите заново';
  if(code===400)return 'Ошибка запроса: '+body.slice(0,120);
  return 'Ошибка '+code;
}

/* ================= РАСЧЁТ ================= */
/* Уровень считается из двух потолков — берётся МЕНЬШИЙ:
     1) потолок по кассе: если внесены смены — касса ÷ смены сравнивается
        с cfg.shift8/cfg.shift7; если смены не внесены — берётся вся
        недельная касса и сравнивается с cfg.week8/cfg.week7;
     2) потолок по опозданиям: cfg.late6 и больше — 6%, cfg.late7 — 7%, меньше — можно 8%.
   9% автоматически не выдаётся — хозяйка ставит его вручную (overrideLevel). */
function calc(){
  const w=W(),cfg=DB.calcCfg||defaultCalcCfg();
  const out={rows:[],fund:0,factTotal:0};
  DB.staff.filter(s=>s.active).forEach(s=>{
    const fact=+(w.revenue[s.iiko||s.name]||0);
    const shifts=+((w.shiftsManual||{})[s.id])||0;
    const lateDayMap=(w.lateDays||{})[s.id];
    const lateRaw=lateDayMap?Object.keys(lateDayMap).length:(+((w.lateManual||{})[s.id])||0);
    const reviews=+((w.reviews||{})[s.id])||0;
    const covered=Math.floor(reviews/(cfg.reviewsPerLate||10));
    const late=Math.max(0,lateRaw-covered);
    const posuda=+((w.posuda||{})[s.id])||0;
    const avans=+((w.avans||{})[s.id])||0;
    const mode=shifts>0?'shift':'week';
    const avg=shifts>0?fact/shifts:null;
    const cashLvl=shifts>0
      ?(avg>=cfg.shift8?8:(avg>=cfg.shift7?7:6))
      :(fact>=cfg.week8?8:(fact>=cfg.week7?7:6));
    const lateLvl=late>=cfg.late6?6:(late>=cfg.late7?7:8);
    const autoLvl=Math.min(cashLvl,lateLvl);
    const ov=(w.overrideLevel||{})[s.id];
    const hasOverride=ov!==undefined&&ov!==null&&ov!=='';
    const lvl=hasOverride?+ov:autoLvl;
    const reason=(w.overrideReason||{})[s.id]||'';
    const notes=(w.notes||[]).filter(n=>n.staffId===s.id);
    const fine=notes.reduce((a,n)=>a+(+n.amount||0),0);
    const pay=fact*lvl/100-posuda-avans-fine;
    out.fund+=pay;out.factTotal+=fact;
    out.rows.push({s,fact,shifts,late,lateRaw,reviews,covered,posuda,avans,mode,avg,cashLvl,lateLvl,autoLvl,
      hasOverride,lvl,reason,pay,fine,notes});
  });
  out.rows.sort((a,b)=>b.fact-a.fact);
  return out;
}

function matchStaff(nm){
  const q=norm(nm);
  let s=DB.staff.find(x=>norm(x.name)===q);if(s)return s;
  s=DB.staff.find(x=>norm(x.short||'')===q);if(s)return s;
  s=DB.staff.find(x=>norm(x.name).split(' ').includes(q));if(s)return s;
  s=DB.staff.find(x=>q.split(' ').some(p=>p.length>3&&norm(x.name).includes(p)));
  return s||null;
}

function saveStaff(id){

  if(id){const s=DB.staff.find(x=>x.id===id);s.name=n;s.short=sh;s.iiko=i||n;}
  else DB.staff.push({id:'s'+Date.now()+Math.floor(Math.random()*99),name:n,short:sh,iiko:i||n,active:true});
  closeSheet();render();
}
function toggleStaff(id){const s=DB.staff.find(x=>x.id===id);s.active=!s.active;closeSheet();render();}
function delStaff(id){
  const s=DB.staff.find(x=>x.id===id);
  if(!confirm('Удалить «'+s.name+'» полностью? Его смены, планы и расчёты за все недели тоже сотрутся. Отменить будет нельзя.'))return;
  DB.staff=DB.staff.filter(x=>x.id!==id);
  Object.values(DB.weeks).forEach(w=>{
    delete w.marks[id];delete w.manual[id];
    if(w.lateManual)delete w.lateManual[id];
    if(w.lateDays)delete w.lateDays[id];
    if(w.reviews)delete w.reviews[id];
    if(w.shiftsManual)delete w.shiftsManual[id];
    if(w.posuda)delete w.posuda[id];
    if(w.avans)delete w.avans[id];
    if(w.overrideLevel)delete w.overrideLevel[id];
    if(w.overrideReason)delete w.overrideReason[id];
    w.notes=(w.notes||[]).filter(n=>n.staffId!==id);
    Object.keys(w.assign||{}).forEach(d=>Object.keys(w.assign[d]).forEach(z=>{
      w.assign[d][z]=w.assign[d][z].filter(x=>x!==id);}));
  });
  closeSheet();render();
}

/* ================= ВЫГРУЗКИ ================= */
function loadIiko(el){
  const f=el.files[0];if(!f)return;
  readXlsx(f,rows=>{
    /* ищем строку заголовков — подходит и «Ведомость заработной платы» от бухгалтера,
       и старый отчёт iiko по зонам */
    let h=-1;
    for(let i=0;i<Math.min(rows.length,20);i++){
      if(rows[i].some(c=>/Официант/i.test(String(c||'')))){h=i;break;}
    }
    if(h<0){alert('Не удалось разобрать файл: не найдена строка с заголовками');return;}
    const hdr=[];for(let i=0;i<rows[h].length;i++)hdr.push(String(rows[h][i]||'').toLowerCase());
    const colName=hdr.findIndex(c=>c.includes('официант'));
    let colTotal=hdr.findIndex(c=>c.includes('сумма продаж'));
    if(colTotal<0)colTotal=hdr.findIndex(c=>c.includes('сумма со скидкой'));
    if(colTotal<0)colTotal=hdr.map((c,i)=>({c,i})).filter(x=>x.c.includes('сумма')).pop()?.i ?? -1;
    const colPosuda=hdr.findIndex(c=>c.includes('посуд'));
    const colAvans=hdr.findIndex(c=>c.includes('аванс'));
    if(colName<0||colTotal<0){alert('Не удалось разобрать файл: не найдены колонки «Официант» и «Сумма»');return;}

    const body=rows.slice(h+1);
    const isTotal=v=>/\sвсего\s*$/i.test(String(v||''));
    const hasTotals=body.some(r=>isTotal(r[colName]));
    const rev={},posuda={},avans={};
    const num=v=>{const n=+String(v??'').replace(/\s/g,'').replace(',','.');return isNaN(n)?0:n;};
    body.forEach(r=>{
      let nm=String(r[colName]??'').trim();
      if(!nm||/^итого$/i.test(nm))return;
      const t=num(r[colTotal]);
      if(t<=0)return;
      if(hasTotals){
        if(!isTotal(nm))return;
        nm=nm.replace(/\s*всего\s*$/i,'').trim();
      }
      rev[nm]=(rev[nm]||0)+t;
      if(colPosuda>=0)posuda[nm]=(posuda[nm]||0)+num(r[colPosuda]);
      if(colAvans>=0)avans[nm]=(avans[nm]||0)+num(r[colAvans]);
    });
    if(!Object.keys(rev).length){alert('В файле не нашлось строк с выручкой официантов');return;}
    W().revenue=rev;
    if(colPosuda>=0||colAvans>=0){
      const w=W();
      Object.entries(rev).forEach(([nm])=>{
        const s=matchStaff(nm);if(!s)return;
        if(colPosuda>=0&&posuda[nm])w.posuda[s.id]=posuda[nm];
        if(colAvans>=0&&avans[nm])w.avans[s.id]=avans[nm];
      });
    }
    render();
    const miss=Object.keys(rev).filter(n=>!matchStaff(n));
    alert('Загружено: '+Object.keys(rev).length+' официантов, касса '+fmt(Object.values(rev).reduce((a,b)=>a+b,0))
      +(colPosuda>=0?'\nПосуда — забрана из файла':'')
      +(colAvans>=0?'\nАвансы — забраны из файла':'')
      +(miss.length?'\n\nНе найдены в системе: '+miss.join(', '):''));
  });
}
function readXlsx(f,cb){
  const rd=new FileReader();
  rd.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
    cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false}));
  }catch(err){alert('Ошибка чтения: '+err.message);}};
  rd.readAsArrayBuffer(f);
}
function saveFile(){
  const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`Жаксылык_${iso(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);
}
function loadFile(el){
  const f=el.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{try{const o=JSON.parse(e.target.result);
    if(!o.staff||!o.weeks)throw new Error('не тот файл');
    Object.assign(DB,o);DB.calcCfg=Object.assign(defaultCalcCfg(),DB.calcCfg||{});render();alert('Данные загружены');
  }catch(err){alert('Не удалось прочитать: '+err.message);}};
  rd.readAsText(f);
}

  sy=window.scrollY;
  document.body.style.position='fixed';document.body.style.top=-sy+'px';

  document.getElementById('ov').classList.remove('on');
  document.body.style.position='';document.body.style.top='';
  document.body.style.left='';document.body.style.right='';

}
